name: Deploy React to Github Pages

on: 
  push: 
    branches: 
      - main
      - 'feature/**'
    paths-ignore:
      - README.md
      - '.github/workflows/*'
  workflow_dispatch: 
  

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4
      - name: Set up Node and install dependencies
        uses: ./.github/actions/setupnode
        # with: 
        #   node-version: 20

      - name: Run Tests
        run: npm run test
      - name: Completed Job
        run: echo "Test job was success"


  build:
      needs: test
      runs-on: windows-latest
   
      steps:
        - name: Get Code
          uses: actions/checkout@v4
        - name: Set up Node and install dependencies
          uses: ./.github/actions/setupnode
        - name: Build project
          run: npm run build
        - name: Upload dist artifact
          uses: actions/upload-artifact@v4
          with: 
            name: dist-files
            path: dist
        - name: Completed Job
          run: echo "Test job was success"

  deploy: 
      needs: build
      runs-on: windows-latest
   
      steps:
        - name: Download Dist Artifact
          uses: actions/download-artifact@v4
          with: 
            name: dist-files
            path: dist
        - name: Deploy Dist
          run: |
            echo 'deploying below files'
            ls dist
            echo "Deployment Completed"

           

  



     
        